<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisa tu carrito de compras en Kings.">

    <title>Kings | Carrito</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header class="encabezado">
        <a class="logo" href="index.html" aria-label="Kings, inicio">
            KINGS<span>★</span>
        </a>

        <nav aria-label="Navegación principal">
            <ul class="menu">
                <li>
                    <a href="index.html" aria-current="page">Inicio</a>
                </li>
                <li>
                    <a href="productos.html">Productos</a>
                </li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li>
                    <a href="carrito.html">
                        Carrito (<span id="contador-carrito">0</span>)
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccion" aria-labelledby="titulo-carrito">
            <h1 id="titulo-carrito">Tu carrito</h1>

            <p
                id="mensaje-carrito"
                class="mensaje-carrito"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            ></p>

            <div id="contenido-carrito" class="contenido-carrito"></div>

            <div class="resumen-carrito">

                <p>
                    Total:
                    <strong id="total-carrito">
                        $0
                    </strong>
                </p>

                <button
                    id="finalizar-compra"
                    class="boton"
                    type="button"
                >
                    Finalizar compra
                </button>

                <button
                    id="vaciar-carrito"
                    class="boton boton-secundario"
                    type="button"
                >
                    Vaciar carrito
                </button>

                <a
                    class="boton"
                    href="productos.html"
                >
                    Seguir comprando
                </a>

            </div>
        </section>
    </main>

    <footer class="pie">
        <p class="marca-footer">KINGS</p>
        <p>Tienda online de jockeys.</p>
        <p>© 2026 Kings.</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/ordenes.js"></script>
    <script src="js/vista-carrito.js"></script>
</body>
</html>
