<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Kings | Administrar usuarios</title>

    <link
        rel="stylesheet"
        href="../css/estilos.css"
    >
</head>

<body class="admin-body">
    <div class="admin-contenedor">
        <aside class="admin-menu">
            <a
                href="index.html"
                class="admin-logo"
            >
                KINGS<span>★</span>
            </a>
            <nav>

                <ul class="admin-navegacion">
                    <li>
                        <a href="index.html">
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a href="productos.html">
                            Productos
                        </a>
                    </li>
                    <li>
                        <a
                            href="usuarios.html"
                            aria-current="page"
                        >
                            Usuarios
                        </a>
                    </li>
                    <li>
                        <a href="ordenes.html">
                            Órdenes
                        </a>
                    </li>
                    <li>
                        <a href="../index.html">
                            Ver tienda
                        </a>
                    </li>
                </ul>
            </nav>
            <button
                id="boton-cerrar-sesion"
                class="boton boton-cerrar-sesion"
                type="button"
            >
                Cerrar sesión
            </button>
        </aside>

        <main class="admin-principal">
            <header class="admin-encabezado">
                <div>
                    <p class="etiqueta">
                        ADMINISTRACIÓN
                    </p>
                    <h1>
                        Usuarios
                    </h1>
                    <p>
                        Administra las cuentas
                        registradas en Kings.
                    </p>
                </div>
                <div class="admin-usuario">
                    <strong id="nombre-usuario">
                        Usuario
                    </strong>
                    <span id="rol-usuario">
                        -
                    </span>
                </div>
            </header>

            <section class="admin-barra-acciones">
                <div>
                    <h2>
                        Usuarios registrados
                    </h2>
                    <p id="cantidad-usuarios">
                        0 usuarios
                    </p>
                </div>
                <a
                    href="usuario-formulario.html"
                    class="boton"
                >
                    + Nuevo usuario
                </a>

            </section>
            <p
                id="mensaje-admin-usuarios"
                role="status"
                aria-live="polite"
            ></p>

            <section class="admin-tabla-contenedor">
                <div class="admin-tabla-responsive">
                    <table class="admin-tabla">
                        <thead>
                            <tr>
                                <th>
                                    RUN
                                </th>
                                <th>
                                    Nombre
                                </th>
                                <th>
                                    Correo
                                </th>
                                <th>
                                    Rol
                                </th>
                                <th>
                                    Región
                                </th>
                                <th>
                                    Comuna
                                </th>
                                <th>
                                    Acciones
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-admin">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
